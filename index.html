.tab.on{background:var(--btn);color:#fff;border-color:var(--btn)}

const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function open_(pw){
  const k0=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw.replace(/[^0-9A-Za-z]/g,'').toUpperCase()),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(DATA.salt),iterations:DATA.iter,hash:'SHA-256'},k0,{name:'AES-GCM',length:256},false,['decrypt']);
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(DATA.iv)},key,b64(DATA.ct));
  return JSON.parse(new TextDecoder().decode(pt));
}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function card(v){const c=document.createElement('div');
  if(!v.id){c.className='card soon';c.innerHTML=`<div class="thumb"></div><div class="body"><div class="no">第${esc(v['回'])}回</div><div class="ttl">${esc(v['題名'])}</div></div>`;return c}
  c.className='card';
  c.innerHTML=`<div class="thumb"><img loading="lazy" alt="" src="https://i.ytimg.com/vi/${esc(v.id)}/hqdefault.jpg"></div>
  <div class="body"><div class="no">第${esc(v['回'])}回</div><div class="ttl">${esc(v['題名'])}</div><p class="desc">${esc(v['説明'])}</p>
  <button class="play">▶ この解説動画を見る</button></div>`;
  c.querySelector('.play').onclick=()=>{c.querySelector('.thumb').innerHTML=`<iframe src="https://www.youtube-nocookie.com/embed/${esc(v.id)}?autoplay=1&rel=0&playsinline=1&cc_load_policy=0&hl=ja" allow="autoplay; encrypted-media; fullscreen" allowfullscreen></iframe>`;};
  return c}
function show(units){
  const m=document.getElementById('m');m.innerHTML='';
  const subs=[...new Set(units.map(u=>u['科目']))];
  const tabs=document.createElement('div');tabs.className='tabs';m.appendChild(tabs);
  const box=document.createElement('div');m.appendChild(box);
  function draw(sub){[...tabs.children].forEach(b=>b.classList.toggle('on',b.textContent===sub));box.innerHTML='';
    units.filter(u=>u['科目']===sub).forEach((u,i)=>{const d=document.createElement('details');const n=u['動画'].filter(v=>v.id).length;
      if(n)d.open=true;d.innerHTML=`<summary>${esc(u['単元'])}<small>${n} / ${u['動画'].length} 本</small></summary>`;
      u['動画'].forEach(v=>d.appendChild(card(v)));box.appendChild(d);});
    try{localStorage.setItem('bio_sub',sub)}catch(e){}}
  subs.forEach(s=>{const b=document.createElement('button');b.className='tab';b.textContent=s;b.onclick=()=>draw(s);tabs.appendChild(b)});
  let last=null;try{last=localStorage.getItem('bio_sub')}catch(e){}
  draw(subs.includes(last)?last:subs[0]);
}
async function tryOpen(pw,save){try{const d=await open_(pw);if(save){try{localStorage.setItem('bio_pw',pw)}catch(e){}}show(d);return true}catch(e){return false}}
document.getElementById('go').onclick=async()=>{const pw=document.getElementById('pw').value;
  if(!await tryOpen(pw,true))document.getElementById('err').textContent='合言葉がちがいます';};
document.getElementById('pw').addEventListener('keydown',e=>{if(e.key==='Enter')document.getElementById('go').click()});
(async()=>{let s=null;try{s=localStorage.getItem('bio_pw')}catch(e){}if(s)await tryOpen(s,false)})();
</script></body></html>
